<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Test</title>
    <link rel="stylesheet" href="rifts_ultimate.css">
    <script src="scripts.js"></script>
</head>

<body>
    <header>
        <!-- snippet with nav code -->
        <include src="html_snips/rifts_ultimate_nav.html"></include>
    </header>

    <main>
        <section id="toc section">
            <!-- start .toc -->
            <div id="toc division">
                <h1 id="toc">Test - TOC</h1>
                <div class="content">
                    <ul class="toc-list">
                    </ul>
                </div>
            </div>

        </section>
        <section>
            <div>
                <h2 id="the_priciples_of_magic">Test</h2>
                <div id="json data"></div>
            </div>
        </section>
        <section id="end"></section>
    </main>

    <footer>
    </footer>
</body>
<script>
    //let data;
    const mainUL = document.createElement('ul');

    // fetch json file
    fetch('TW_gems.json')
        .then(Response => Response.json())
        .then(data => {

            console.log(data);

            // filter for invocation spells
            const filtered = data.filter(
                function(data){return data.title == 'Invocation Spells'});

            console.log(filtered);

            // create primary list element for gem
            for (let i = 0; i < filtered[0].gems.length; ++i) {
                const gemLI = document.createElement('li');
                gemLI.innerHTML = filtered[0].gems[i].name.bold();

                // create list for supported spells
                const sSpellsUL = document.createElement('ul');
                for (var n in filtered[0].gems[i].spells) {
                    const sSpellLI = document.createElement('li');
                    sSpellLI.innerHTML = filtered[0].gems[i].spells[n];
                    sSpellsUL.appendChild(sSpellLI);
                }

                // append supported spell ul to gem li
                gemLI.appendChild(sSpellsUL);


                // append cost per carat li
                const cpcUL = document.createElement('ul');
                const cpcLI = document.createElement('li');
                cpcLI.innerHTML = "Cost per carat: " + filtered[0].gems[i].costpercarat;
                cpcUL.appendChild(cpcLI)
                gemLI.appendChild(cpcUL);

                // append gem LI to main UL
                mainUL.appendChild(gemLI);
            }

            // add to html element
            const div = document.getElementById('json data');
            div.appendChild(mainUL);

            // log
            console.log(data);
        })
        .catch(error => console.error('Error fetching JSON:', error));



</script>

</html>
